org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Disable R8 full mode to prevent missing class errors with AGP 8.x
# See: https://github.com/flutter/flutter/issues/146266
android.enableR8.fullMode=false

# The next two flags do nothing on AGP 8.x. They keep Kotlin plugins and the
# old AGP DSL working once the project moves to AGP 9 (Flutter re-adds them if
# they are removed).
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
